<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome | Choose Your Project</title>
  <link rel="stylesheet" href="css/dark-style.css" />
  <style>
    body.page-index {
      background: linear-gradient(135deg, #121212 0%, #003459 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    .logo-container-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 1.5rem auto;
      z-index: 1;
    }

    .logo-container {
      position: absolute;
      left: 50%;
      top: 65%;
      width: 240px;
      height: 240px;
      transform: translate(-50%, -50%) scale(1.2);
      pointer-events: none;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .dots {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 76px; height: 76px;
      border-radius: 50%;
      pointer-events: none;
      background: #00E5FF33;
      filter: blur(0.5px);
    }

    .dot-inner {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #00E5FF;
      box-shadow: 0 0 24px 8px rgba(0,229,255,0.25);
      border: 6px solid #181C20;
    }

    @media (max-width: 600px) {
      .logo-container-wrapper { width: 120px; height: 120px; }
      .logo-container { width: 120px; height: 120px; }
      .dot { width: 38px; height: 38px; }
      .dot-inner { border-width: 3px; box-shadow: 0 0 12px 4px rgba(0,229,255,0.25); }
    }
  </style>
</head>
<body class="page-index">
  <div class="container">
    <div class="logo-container-wrapper">
      <div class="logo-container">
        <!-- SVG ring + core + halved “O” -->
        <svg class="logo-svg" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- pulsing bicolor radial gradient core -->
            <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8">
                <animate attributeName="stop-opacity"
                         values="0.6;0.9;0.6"
                         dur="4s" repeatCount="indefinite"/>
              </stop>
              <stop offset="60%" stop-color="#00FFA3" stop-opacity="0.6">
                <animate attributeName="stop-opacity"
                         values="0.4;0.8;0.4"
                         dur="4s" repeatCount="indefinite"/>
              </stop>
              <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
            </radialGradient>

            <!-- glow filter for the outer ring -->
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- static glowing ring -->
          <circle cx="540" cy="540" r="320"
                  fill="none"
                  stroke="#00E5FF"
                  stroke-width="18"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  opacity="0.35"
                  filter="url(#glow)" />

          <!-- pulsing gradient core -->
          <circle cx="540" cy="540" r="120"
                  fill="url(#coreGrad)" />

          <!-- “O” outline with two gaps -->
          <circle cx="540" cy="540" r="120"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="22"
                  stroke-linecap="round"
                  stroke-dasharray="320 40 320 40"
                  transform="rotate(-45 540 540)" />
        </svg>

        <!-- Four wobbling orbiting dots -->
        <div class="dots">
          <div class="dot dot1"><div class="dot-inner"></div></div>
          <div class="dot dot2"><div class="dot-inner"></div></div>
          <div class="dot dot3"><div class="dot-inner"></div></div>
          <div class="dot dot4"><div class="dot-inner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <main class="container" style="padding: 4rem 0; text-align: center;">
    <h1>Welcome to Oscyra Solutions</h1>
    <div class="landing-options">
      <a href="dynamic-os.html" class="btn btn-primary nav-link">Dynamic OS</a>
      <a href="klar.html" class="btn btn-primary nav-link">Klar-Engine</a>
      <a href="project-aion.html" class="btn btn-primary nav-link">Project Aion</a>

    </div>
  </main>

  <script>
    const DOT_COLORS    = ["#00E5FF", "#00FFA3", "#00E5FF", "#00FFA3"];
    const DOT_ANGLES    = [0, 90, 180, 270];
    const DOT_RADIUS    = 38;    // px in base 240×240
    const ORBIT_RADIUS  = 140;   // matches NODE_ORBIT

    const container = document.querySelector('.logo-container');
    const dots      = [
      document.querySelector('.dot1'),
      document.querySelector('.dot2'),
      document.querySelector('.dot3'),
      document.querySelector('.dot4')
    ];
    const inners    = dots.map(d => d.querySelector('.dot-inner'));

    // prepare dot colors/borders
    inners.forEach((inner, i) => {
      inner.style.background = DOT_COLORS[i];
      inner.style.borderColor = "#181C20";
    });

    function animate(ts) {
      const t  = ts / 1000;
      const w  = container.offsetWidth;
      const cx = w/2, cy = w/2;
      const baseOrbit = w * (ORBIT_RADIUS / 240);

      for (let i = 0; i < 4; i++) {
        // combine steady spin + sinusoidal wobble
        const steady = (360 * t / 10) % 360;
        const wobble = 30 * Math.sin(t + i * Math.PI/2);
        const deg    = DOT_ANGLES[i] + steady + wobble;
        const rad    = deg * Math.PI/180;

        // pulsing size/glow
        const pulse    = 0.5 + 0.5 * Math.sin(2*t + i * Math.PI/2);
        const glowSize = DOT_RADIUS * (1.5 + 0.2*pulse) * (w/240);
        const dotSize  = DOT_RADIUS * (1.0 + 0.12*pulse) * (w/240);

        const x = cx + baseOrbit * Math.cos(rad);
        const y = cy + baseOrbit * Math.sin(rad);

        // outer glow
        dots[i].style.width      = dots[i].style.height = `${glowSize}px`;
        dots[i].style.left       = `${x - glowSize/2}px`;
        dots[i].style.top        = `${y - glowSize/2}px`;
        dots[i].style.background = DOT_COLORS[i] + '33';

        // inner dot
        const inner = inners[i];
        inner.style.width      = inner.style.height = `${dotSize}px`;
        inner.style.boxShadow  = `0 0 ${glowSize/1.5}px ${glowSize/5}px ${DOT_COLORS[i]}44`;
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // smooth fade-out on navigation
    document.querySelectorAll('a.nav-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => window.location = link.href, 500);
      });
    });
  </script>
</body>
</html>
